[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-assistant-backend"
version = "0.6.0"
description = "DB Assistant backend - Task 6 production reporting and hardening"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "greenlet>=3.0.0,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<7",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "cryptography>=44,<47",
  "duckdb>=1.2,<2",
  "openpyxl>=3.1,<4",
  "asyncmy>=0.2.10,<1",
  "aioodbc>=0.5,<1",
  "pyodbc>=5.2,<6",
  "httpx>=0.28,<1",
  "sqlglot>=26,<30",
  "deepagents>=0.7.3,<0.8",
  "langchain-openai>=1.3.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
