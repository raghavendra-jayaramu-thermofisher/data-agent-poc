services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbassistant
      POSTGRES_PASSWORD: dbassistant
      POSTGRES_DB: dbassistant
    ports:
      - "127.0.0.1:12202:5432"
    volumes:
      - dbassistant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbassistant -d dbassistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:12203:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dbassistant-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbassistant-postgres:
  dbassistant-redis:
