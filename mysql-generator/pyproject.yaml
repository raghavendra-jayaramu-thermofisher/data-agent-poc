# ==============================================================================
# Excel to MySQL Generator Project Configuration
# ==============================================================================
project:
  name: "mysql-generator"
  version: "0.1.0"
  description: "Convert Excel spreadsheets (.xlsx) into ready-to-run MySQL dump scripts (.sql) with CLI and Streamlit UI"
  readme: "README.md"
  requires-python: ">=3.8"
  license: "MIT"
  authors:
    - name: "BI Engineering Team"

dependencies:
  - "streamlit>=1.30.0"
  - "openpyxl>=3.1.2"

scripts:
  excel-to-mysql: "excel_to_mysql:main"
  mysql-generator-ui: "streamlit run app.py --server.address 127.0.0.1 --server.port 12204"
